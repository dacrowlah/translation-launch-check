[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "T20", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.pylint]
max-args = 4

[tool.ruff.lint.isort]
known-first-party = ["_shared", "_config", "_text", "builders"]

[tool.pytest.ini_options]
testpaths = ["tests"]
