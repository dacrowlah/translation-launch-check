[tool.ruff]
target-version = "py312"
line-length = 100
src = ["code_steps", "tests"]  # first-party for isort; tests/fakes stays third-party

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "T10", "T20", "A", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.pylint]
max-args = 4

[tool.pytest.ini_options]
testpaths = ["tests"]
